name: Seed corpus

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Refresh AfterImage corpus
        env:
          AFTERIMAGE_API_KEY: ${{ secrets.AFTERIMAGE_API_KEY }}
        run: python scripts/seed.py --host https://afterimage.page --concurrency 3 --refresh
